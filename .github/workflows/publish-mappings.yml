name: Publish CSS mappings

on:
  push:
    branches: [main]
    paths:
      - css_mappings.py
      - vite_css.py
      - mapping_changes.py
      - packages/decky-extras/**
      - tools/runtime_probe.ts
      - tools/icons_report.ts
      - tools/dev_guide*.ts
      - tools/dev_guide_client.js
      - package.json
      - bun.lock
      - .github/workflows/publish-mappings.yml
      - pyproject.toml
      - uv.lock
      - .python-version
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.0"
      - name: Generate and retain stable and beta mappings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export TMPDIR="${RUNNER_TEMP}/steamui-watch"
          mkdir -m 700 -p "$TMPDIR"
          gh auth setup-git
          gh repo clone "$GITHUB_REPOSITORY" "$TMPDIR/mappings" -- --branch mapping-data --depth 1
          # Python from .python-version; --locked fails if uv.lock no longer matches pyproject.toml.
          uv run --locked --no-dev python css_mappings.py "$TMPDIR/mappings"
          git -C "$TMPDIR/mappings" config user.name 'github-actions[bot]'
          git -C "$TMPDIR/mappings" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$TMPDIR/mappings" add webpack webpack-mappings webpack-literals
          if [ -d "$TMPDIR/mappings/css-fingerprints" ]; then
            git -C "$TMPDIR/mappings" add css-fingerprints
          fi
          if ! git -C "$TMPDIR/mappings" diff --cached --quiet; then
            git -C "$TMPDIR/mappings" commit -m 'chore(mappings): retain Steam Deck class history'
            git -C "$TMPDIR/mappings" push origin HEAD:mapping-data
          fi
          mkdir "$TMPDIR/site"
          cp "$TMPDIR/mappings/stable.json" "$TMPDIR/mappings/beta.json" "$TMPDIR/site/"
          cp "$TMPDIR/mappings/LICENSE" "$TMPDIR/site/LICENSE.txt"
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Get @decky/ui
        # The packages the decky-loader fork boots by client bundle format: @decky/ui-legacy on Webpack,
        # @decky/ui-v5 on ES modules. A failure here fails the extras and guide steps, which keep their
        # published versions; CSS delivery goes on.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/steamui-watch/decky-ui"
          mkdir -p "$dir"
          lock=$(gh api repos/beallio/decky-loader/contents/frontend/pnpm-lock.yaml --jq .content | base64 -d)
          # pnpm locks an npm: alias as `version: '@decky/ui@4.16.4'` two lines below its importer entry.
          locked() {
            awk -v name="'@decky/ui-$1':" -v q="'" '$1 == name && !found { getline; getline; sub(/^ *version: */, ""); gsub(q, ""); sub(/^@decky\/ui@/, ""); sub(/[(].*/, ""); print; found = 1 }' <<<"$lock"
          }
          for format in webpack:legacy esm:v5; do
            v=$(locked "${format#*:}")
            [ -n "$v" ] || { echo "no @decky/ui-${format#*:} version in the decky-loader lock file" >&2; exit 1; }
            npm pack "@decky/ui@$v" --pack-destination "$dir" --silent
            mkdir -p "$dir/${format%%:*}"
            tar -xzf "$dir/decky-ui-$v.tgz" -C "$dir/${format%%:*}"
          done
      - name: Validate and stage Decky extras
        id: extras
        continue-on-error: true
        run: |
          export TMPDIR="$RUNNER_TEMP/steamui-watch"
          bun install --frozen-lockfile
          # The UI packages the fork locks; the extras must not need anything else from our loader fork.
          # Reject this extras update on a miss; CSS delivery still uses the previous extras below.
          bun tools/runtime_probe.ts --extras-only \
            --decky-ui-webpack "$TMPDIR/decky-ui/webpack/package" --decky-ui-esm "$TMPDIR/decky-ui/esm/package" \
            --icons-dir "$TMPDIR/icons"
          bun packages/decky-extras/build.ts --outdir "$TMPDIR/extras-package"
          npm pack "$TMPDIR/extras-package" --pack-destination "$TMPDIR" --silent
          # decky-extras.json is the schema 1 copy for 0.2.x/0.3.x; it keeps published finders that need schema 2 atoms.
          curl --fail --location --silent --show-error --max-time 30 \
            https://beallio.github.io/steamui-watch/decky-extras.json --output "$TMPDIR/published-extras.json"
          bun packages/decky-extras/feed.ts --previous "$TMPDIR/published-extras.json" --outdir "$TMPDIR/site"
          bun -e 'import { publicFeed } from "./tools/icons_report"; await Bun.write(Bun.argv.at(-1), JSON.stringify(await publicFeed(Bun.argv.at(-2)), null, 2) + "\n");' \
            "$TMPDIR/icons" "$TMPDIR/site/decky-icons.json"
      - name: Retain published extras after validation failure
        if: steps.extras.outcome == 'failure'
        run: |
          dir="$RUNNER_TEMP/steamui-watch"
          rm -f "$dir/site/decky-extras.json" "$dir/site/decky-extras-v2.json" "$dir/site/decky-icons.json"
          curl --fail --location --silent --show-error --max-time 30 \
            https://beallio.github.io/steamui-watch/decky-extras.json --output "$dir/previous-extras.json"
          bun -e 'import { parseManifestV1 } from "./packages/decky-extras/match"; parseManifestV1(await Bun.file(Bun.argv.at(-1)).json());' "$dir/previous-extras.json"
          cp "$dir/previous-extras.json" "$dir/site/decky-extras.json"
          # Only a confirmed 404 (nothing published yet) may drop v2; any other failure stops deployment,
          # so the published pair stays live.
          code=$(curl --location --silent --show-error --max-time 30 --write-out '%{http_code}' \
            https://beallio.github.io/steamui-watch/decky-extras-v2.json --output "$dir/previous-extras-v2.json")
          case "$code" in
            200)
              bun -e 'import { parseManifest } from "./packages/decky-extras/match"; parseManifest(await Bun.file(Bun.argv.at(-1)).json());' "$dir/previous-extras-v2.json"
              cp "$dir/previous-extras-v2.json" "$dir/site/decky-extras-v2.json" ;;
            404) echo "::warning::No decky-extras-v2.json is published yet; 0.4.0+ plugins use their bundled definitions." ;;
            *) echo "::error::Could not retrieve the published decky-extras-v2.json (HTTP $code)." >&2; exit 1 ;;
          esac
          code=$(curl --location --silent --show-error --max-time 30 --write-out '%{http_code}' \
            https://beallio.github.io/steamui-watch/decky-icons.json --output "$dir/previous-icons.json")
          case "$code" in
            200)
              bun -e 'import { validatePublishedIcons } from "./tools/icons_report"; validatePublishedIcons(await Bun.file(Bun.argv.at(-1)).json());' "$dir/previous-icons.json"
              cp "$dir/previous-icons.json" "$dir/site/decky-icons.json" ;;
            404) echo "::warning::No decky-icons.json is published yet; leaving it out." ;;
            *) echo "::error::Could not retrieve the published decky-icons.json (HTTP $code)." >&2; exit 1 ;;
          esac
          echo "::warning::Extras validation failed. Publishing fresh CSS mappings with the previous extras definitions; skipping the extras release."
      - name: Generate and stage developer guide
        id: guide
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export TMPDIR="$RUNNER_TEMP/steamui-watch"
          bun install --frozen-lockfile
          # Reuse cached metadata-only Webpack baseline from finder-data when available; save once on first run.
          baseline_args=()
          if gh repo clone "$GITHUB_REPOSITORY" "$TMPDIR/finder-data" -- --branch finder-data --depth 1 2>/dev/null; then
            baseline_file="$TMPDIR/finder-data/baselines/webpack-latest.json"
            if [ -f "$baseline_file" ]; then
              baseline_args=(--webpack-baseline "$baseline_file")
            else
              baseline_args=(--save-webpack-baseline "$baseline_file")
            fi
          fi
          guide_out="$TMPDIR/guide-out"
          rm -rf "$guide_out"
          # Public Pages build: strict metadata only (never pass --with-previews).
          bun tools/dev_guide.ts \
            --mapping-data "$TMPDIR/mappings" \
            --out-dir "$guide_out" \
            --decky-ui-webpack "$TMPDIR/decky-ui/webpack/package" \
            --decky-ui-esm "$TMPDIR/decky-ui/esm/package" \
            "${baseline_args[@]}"
          if [ -d "$TMPDIR/finder-data/.git" ] && [ -f "$TMPDIR/finder-data/baselines/webpack-latest.json" ]; then
            git -C "$TMPDIR/finder-data" add baselines/webpack-latest.json
            if ! git -C "$TMPDIR/finder-data" diff --cached --quiet; then
              git -C "$TMPDIR/finder-data" -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'chore(dev-guide): retain pre-Vite Webpack export baseline'
              git -C "$TMPDIR/finder-data" push origin HEAD:finder-data || echo "::warning::Could not push cached Webpack baseline to finder-data."
            fi
          fi
          rm -rf "$TMPDIR/site/guide"
          mkdir -p "$TMPDIR/site/guide"
          cp "$guide_out/index.html" "$guide_out/data.json" "$TMPDIR/site/guide/"
      - name: Retain published developer guide after generation failure
        if: steps.guide.outcome == 'failure'
        run: |
          rm -rf "$RUNNER_TEMP/steamui-watch/site/guide"
          previous="$RUNNER_TEMP/steamui-watch/previous-guide"
          rm -rf "$previous" && mkdir -p "$previous"
          if curl --fail --location --silent --show-error --max-time 30 \
              https://beallio.github.io/steamui-watch/guide/index.html --output "$previous/index.html" \
            && curl --fail --location --silent --show-error --max-time 30 \
              https://beallio.github.io/steamui-watch/guide/data.json --output "$previous/data.json" \
            && bun -e 'import { validatePublicGuideData } from "./tools/dev_guide_schema"; const errs = validatePublicGuideData(await Bun.file(Bun.argv.at(-1)).json()); if (errs.length) throw new Error(errs.join("; "));' "$previous/data.json"; then
            mkdir -p "$RUNNER_TEMP/steamui-watch/site/guide"
            cp "$previous/index.html" "$previous/data.json" "$RUNNER_TEMP/steamui-watch/site/guide/"
            echo "::warning::Developer guide generation failed. Publishing fresh CSS mappings with the previous developer guide."
          else
            echo "::warning::Developer guide generation failed and no valid previous guide was available. Publishing fresh CSS mappings without /guide/."
          fi
      # One artifact name per attempt: a re-run would otherwise list two github-pages artifacts, which deploy-pages refuses.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/steamui-watch/site
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for the Pages artifact to be listed
        # deploy-pages lists the run's artifacts once; on 2026-11-23 that list was still empty 0.3 s after the upload.
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: github-pages-${{ github.run_attempt }}
        run: |
          for _ in $(seq 30); do
            listed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq "any(.artifacts[]; .name == \"$ARTIFACT\")") || listed=false
            [ "$listed" = true ] && exit 0
            sleep 2
          done
          echo "::warning::The $ARTIFACT artifact is not listed after 60 seconds; deploying anyway."
      - uses: actions/deploy-pages@v5
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Publish the Decky extras package
        if: steps.extras.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export TMPDIR="$RUNNER_TEMP/steamui-watch"
          version=$(bun -p 'require("./packages/decky-extras/package.json").version')
          tag="decky-extras-v$version"
          releases=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName)
          # Release assets keep old plugin lock files working. Finder updates need no new package release.
          if jq -e --arg tag "$tag" 'any(.[]; .tagName == $tag)' <<<"$releases" >/dev/null; then exit 0; fi
          gh release create "$tag" "$TMPDIR/beallio-decky-extras-$version.tgz" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Decky extras $version" \
            --notes "Extra Steam components for plugins on standard Decky Loader. Install the attached package with npm or pnpm. Finder updates download from the steamui-watch Pages site; no custom loader is required."
      - name: Open an issue for new mappings
        # always(): report retained versions even if deployment failed.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT: ${{ steps.deployment.outcome }}
        run: |
          mappings="$RUNNER_TEMP/steamui-watch/mappings"
          [ -d "$mappings/.git" ] || exit 0
          # Every version we added on top of the upstream snapshot that seeded mapping-data must appear
          # in an issue title (open or closed), so a failed or interrupted run is announced by the next one.
          # Pinned, not live upstream: a version DeckThemes adds later must not hide our unannounced one.
          # .github/upstream-baseline: the DeckThemes commit last merged into mapping-data.
          baseline=$(cat .github/upstream-baseline)
          upstream=$(gh api "repos/$GITHUB_REPOSITORY/contents/webpack?ref=$baseline" --jq '.[].name')
          retained=$(cd "$mappings/webpack" && for f in *.json; do grep -qxF "$f" <<<"$upstream" || basename "$f" .json; done)
          titles=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 1000 --json title --jq '.[].title')
          new_dumps=$(for v in $retained; do grep -qwF "$v" <<<"$titles" || echo "$v"; done | paste -sd ' ')
          [ -n "$new_dumps" ] || exit 0
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          notice="$RUNNER_TEMP/steamui-watch/notice"
          uv run --locked --no-dev python mapping_changes.py "$mappings" $new_dumps \
            --repository-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --run-url "$run_url" --deployment "$DEPLOYMENT" --output-dir "$notice"
          # Retain readable diffs before opening an issue that links to them.
          if [ -d "$mappings/class-diffs" ]; then
            git -C "$mappings" add class-diffs
            if ! git -C "$mappings" diff --cached --quiet; then
              git -C "$mappings" -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'chore(mappings): retain CSS class diffs'
              git -C "$mappings" push origin HEAD:mapping-data
            fi
          fi
          label=$(cat "$notice/label.txt")
          labels=()
          if [ -n "$label" ]; then labels=(--label "$label"); fi
          gh issue create --repo "$GITHUB_REPOSITORY" --assignee "$GITHUB_REPOSITORY_OWNER" \
            --title "$(cat "$notice/title.txt")" --body-file "$notice/body.md" "${labels[@]}"

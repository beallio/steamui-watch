name: Publish CSS mappings

on:
  push:
    branches: [main]
    paths:
      - css_mappings.py
      - .github/workflows/publish-mappings.yml
      - pyproject.toml
      - uv.lock
      - .python-version
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.0"
      - name: Generate and retain stable and beta mappings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export TMPDIR="${RUNNER_TEMP}/steamui-watch"
          mkdir -m 700 -p "$TMPDIR"
          gh auth setup-git
          gh repo clone "$GITHUB_REPOSITORY" "$TMPDIR/mappings" -- --branch mapping-data --depth 1
          # Python from .python-version. --frozen: uv.lock also records the owner's personal uv settings, which CI lacks.
          uv run --frozen --no-dev python css_mappings.py "$TMPDIR/mappings"
          git -C "$TMPDIR/mappings" config user.name 'github-actions[bot]'
          git -C "$TMPDIR/mappings" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$TMPDIR/mappings" add webpack webpack-mappings
          if ! git -C "$TMPDIR/mappings" diff --cached --quiet; then
            git -C "$TMPDIR/mappings" commit -m 'chore(mappings): retain Steam Deck class history'
            git -C "$TMPDIR/mappings" push origin HEAD:mapping-data
          fi
          mkdir "$TMPDIR/site"
          cp "$TMPDIR/mappings/stable.json" "$TMPDIR/mappings/beta.json" "$TMPDIR/site/"
          cp "$TMPDIR/mappings/LICENSE" "$TMPDIR/site/LICENSE.txt"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/steamui-watch/site
      - uses: actions/deploy-pages@v5
        id: deployment
      - name: Open an issue for new mappings
        # always(): report retained versions even if deployment failed.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT: ${{ steps.deployment.outcome }}
        run: |
          mappings="$RUNNER_TEMP/steamui-watch/mappings"
          [ -d "$mappings/.git" ] || exit 0
          # Every version we added on top of the upstream snapshot that seeded mapping-data must appear
          # in an issue title (open or closed), so a failed or interrupted run is announced by the next one.
          # Pinned, not live upstream: a version DeckThemes adds later must not hide our unannounced one.
          # Update this commit only when deliberately merging upstream into mapping-data.
          baseline=a180462a3688855612a803c20e87ab43304f626e
          upstream=$(gh api "repos/$GITHUB_REPOSITORY/contents/webpack?ref=$baseline" --jq '.[].name')
          retained=$(cd "$mappings/webpack" && for f in *.json; do grep -qxF "$f" <<<"$upstream" || basename "$f" .json; done)
          titles=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 1000 --json title --jq '.[].title')
          new_dumps=$(for v in $retained; do grep -qwF "$v" <<<"$titles" || echo "$v"; done | paste -sd ' ')
          [ -n "$new_dumps" ] || exit 0
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh issue create --repo "$GITHUB_REPOSITORY" --assignee "$GITHUB_REPOSITORY_OWNER" \
            --title "New CSS mappings: $new_dumps" \
            --body "$(printf 'New Steam Deck client versions: `%s`\n\nPages deployment in this run: **%s**\n\n- [Stable mappings](https://beallio.github.io/steamui-watch/stable.json)\n- [Beta mappings](https://beallio.github.io/steamui-watch/beta.json)\n- [Workflow run](%s)\n\nCheck themes on the new version, then close this issue. Keep the version names in the title: they mark the versions as announced.\n' "$new_dumps" "$DEPLOYMENT" "$run_url")"

name: Watch Decky finders

# Early warning: report Steam Deck client versions whose bundle no longer has what the
# @decky/ui and decky-loader finders search for. A beta report comes before the stable update.
on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  # contents: write saves finder snapshots to the finder-data branch.
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    # Backstop only: a normal run takes about 2 minutes. The default is 6 hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.0"
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Get @decky/ui
        # The version the decky-loader fork locks, and npm's latest for the pre-upgrade check.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/steamui-watch/decky-ui"
          mkdir -p "$dir"
          # awk reads to the end: exiting early would kill gh with SIGPIPE under pipefail.
          ui=$(gh api repos/beallio/decky-loader/contents/frontend/pnpm-lock.yaml --jq .content | base64 -d |
            awk '/^      .@decky\/ui.:$/ && !found { getline; getline; sub(/^ *version: */, ""); sub(/[(].*/, ""); print; found = 1 }')
          [ -n "$ui" ] || { echo 'no @decky/ui version in the decky-loader lock file' >&2; exit 1; }
          latest=$(npm view @decky/ui version)
          for v in $(printf '%s\n' "$ui" "$latest" | sort -u); do
            npm pack "@decky/ui@$v" --pack-destination "$dir" --silent
            mkdir "$dir/$v"
            tar -xzf "$dir/decky-ui-$v.tgz" -C "$dir/$v"
          done
          printf 'DECKY_UI=%s\nDECKY_UI_LATEST=%s\n' "$ui" "$latest" >> "$GITHUB_ENV"
      - name: Fetch finder baseline
        # Baselines are read-only inputs; save uses a separate checkout and keeps its existing first-write behavior.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          baseline="$RUNNER_TEMP/steamui-watch/finder-baseline"
          mkdir -p "$baseline/snapshots"
          gh auth setup-git
          gh repo clone "$GITHUB_REPOSITORY" "$baseline/repo" -- --depth 1 --no-checkout
          status=0
          git -C "$baseline/repo" ls-remote --exit-code --heads origin finder-data >/dev/null || status=$?
          case $status in
            0) git -C "$baseline/repo" fetch -q --depth 1 origin finder-data
               git -C "$baseline/repo" checkout -q --detach FETCH_HEAD
               if compgen -G "$baseline/repo/snapshots/*.json" >/dev/null; then
                 cp "$baseline/repo"/snapshots/*.json "$baseline/snapshots/"
               fi ;;
            2) ;;
            *) exit "$status" ;;
          esac
      - name: Check Decky finders in the bundle text
        run: |
          bun install --frozen-lockfile
          table="$RUNNER_TEMP/steamui-watch/finder-table.json"
          bun tools/finder_table.ts "$RUNNER_TEMP/steamui-watch/decky-ui/$DECKY_UI/package" > "$table"
          uv run --locked --no-dev python decky_watch.py --ui-finders "$table" "$RUNNER_TEMP/steamui-watch/reports/static"
          # Pre-upgrade: the reader must also understand npm's latest before the fork locks it.
          if [ "$DECKY_UI_LATEST" != "$DECKY_UI" ]; then
            bun tools/finder_table.ts "$RUNNER_TEMP/steamui-watch/decky-ui/$DECKY_UI_LATEST/package" > /dev/null
          fi
      - name: Run Decky finders in headless Chrome
        # Runs even if the text check failed: the two checks are independent.
        if: always()
        # A hung browser fails this step; the issue step still runs.
        timeout-minutes: 15
        run: |
          export TMPDIR="${RUNNER_TEMP}/steamui-watch/runtime"
          mkdir -m 700 -p "$TMPDIR"
          reports="$RUNNER_TEMP/steamui-watch/reports"
          ui() { echo "$RUNNER_TEMP/steamui-watch/decky-ui/$1/package"; }
          bun tools/runtime_probe.ts --decky-ui "$(ui "$DECKY_UI")" --report-dir "$reports/runtime" \
            --baseline-dir "$RUNNER_TEMP/steamui-watch/finder-baseline/snapshots" \
            --snapshot-dir "$RUNNER_TEMP/steamui-watch/snapshots" --props-dir "$RUNNER_TEMP/steamui-watch/props"
          # Pre-upgrade check: the npm latest the fork has not locked yet. Its passes close older upgrade reports.
          upgrade="$reports/upgrade/$DECKY_UI_LATEST"
          mkdir -p "$upgrade"
          if [ "$DECKY_UI_LATEST" = "$DECKY_UI" ]; then
            cp "$reports"/runtime/*.ok "$upgrade/" 2>/dev/null || true
            exit 0
          fi
          bun tools/runtime_probe.ts --decky-ui "$(ui "$DECKY_UI_LATEST")" --report-dir "$upgrade" \
            --baseline-dir "$RUNNER_TEMP/steamui-watch/finder-baseline/snapshots"
          for f in "$upgrade"/*.md; do
            [ -e "$f" ] || continue
            body=$(cat "$f")
            printf '`@decky/ui` %s is the npm `latest`; the fork locks %s. Fix this before the fork upgrades.\n\n%s\n' "$DECKY_UI_LATEST" "$DECKY_UI" "$body" > "$f"
          done
      - name: Save finder snapshots
        # Retain first finder snapshots and prop observations as reviewed versioned evidence.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          snapshots="$RUNNER_TEMP/steamui-watch/snapshots"
          props="$RUNNER_TEMP/steamui-watch/props"
          reports="$RUNNER_TEMP/steamui-watch/reports/props"
          staged="$RUNNER_TEMP/steamui-watch/prop-reports"
          data="$RUNNER_TEMP/steamui-watch/finder-data"
          has_snapshots=false
          has_props=false
          if compgen -G "$snapshots/*.json" >/dev/null; then has_snapshots=true; fi
          if compgen -G "$props/*.json" >/dev/null; then has_props=true; fi
          [ "$has_snapshots" = true ] || [ "$has_props" = true ] || exit 0
          gh auth setup-git
          gh repo clone "$GITHUB_REPOSITORY" "$data" -- --depth 1 --no-checkout
          # Exit status 2: the branch does not exist yet. Anything else is a real failure.
          status=0
          git -C "$data" ls-remote --exit-code --heads origin finder-data >/dev/null || status=$?
          case $status in
            0) git -C "$data" fetch -q --depth 1 origin finder-data && git -C "$data" checkout -q -B finder-data FETCH_HEAD ;;
            2) git -C "$data" checkout -q --orphan finder-data && git -C "$data" rm -rqf --cached --ignore-unmatch . ;;
            *) exit "$status" ;;
          esac
          mkdir -p "$data/snapshots" "$data/props"
          if [ "$has_props" = true ]; then
            # Compare before retaining the current first-per-version evidence.
            bun tools/props_report.ts "$props" --baseline-dir "$data/props" --out-dir "$staged"
          fi
          # Keep the first snapshot of each client and @decky/ui version: it is the reviewed baseline.
          for f in "$snapshots"/*.json; do
            [ -e "$f" ] || continue
            [ -e "$data/snapshots/${f##*/}" ] || cp "$f" "$data/snapshots/"
          done
          # Keep the first prop snapshot and its source-free author reference for each version.
          for f in "$props"/*.json; do
            [ -e "$f" ] || continue
            name=${f##*/}
            stem=${name%.json}
            [ -e "$data/props/$name" ] || cp "$f" "$data/props/"
            reference="$staged/$stem.reference.md"
            [ ! -f "$reference" ] || [ -e "$data/props/$stem.reference.md" ] || cp "$reference" "$data/props/"
          done
          git -C "$data" config user.name 'github-actions[bot]'
          git -C "$data" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          [ "$has_snapshots" = false ] || git -C "$data" add snapshots
          [ "$has_props" = false ] || git -C "$data" add props
          if ! git -C "$data" diff --cached --quiet; then
            git -C "$data" commit -qm 'chore(finders): retain Decky finder snapshots and extra prop observations'
            git -C "$data" push -q origin HEAD:finder-data
          fi
          # Only announce changes whose reference was saved successfully.
          if [ "$has_props" = true ]; then
            mkdir -p "$reports"
            cp "$staged"/*.md "$reports/"
          fi
      - name: Upload Decky extra prop references
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decky-extra-props
          path: |
            ${{ runner.temp }}/steamui-watch/props/*.json
            ${{ runner.temp }}/steamui-watch/reports/props/*.reference.md
          if-no-files-found: ignore
      - name: Compare the finder copies with the decky-loader fork
        # decky_watch.py and tools/runtime_probe.ts copy the loader's finders by hand; report when the fork moves on.
        # The @decky/ui finders need no copy: each run reads them from the locked package.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fork=beallio/decky-loader
          reports="$RUNNER_TEMP/steamui-watch/reports/copies"
          mkdir -p "$reports"
          loader_copied=$(uv run --locked --no-dev python -c 'import decky_watch as d; print(d.LOADER.split()[-1])')
          compare=$(gh api "repos/$fork/compare/$loader_copied...main")
          # Changed frontend lines that search Steam's code or use Steam's globals. A heuristic: it
          # can miss a change, and it reports some changes that need no update.
          pattern='find[A-Z][A-Za-z]*\(|toString\(|createPropListRegex|SteamClient\.|window\.[A-Z][A-Za-z]*(Store|Manager)\b'
          changes=$(jq -r --arg re "$pattern" '.files[] | select(.filename | startswith("frontend/src/")) | .filename as $f
            | if .patch == null then "\($f): (GitHub shows no diff for this file)"
              else .patch | split("\n")[] | select(test("^[+-]") and test($re)) | "\($f): \(.)" end' <<<"$compare")
          # The compare API lists at most 300 files.
          truncated=$(jq '.files | length >= 300' <<<"$compare")
          if [ -z "$changes" ] && [ "$truncated" = false ]; then
            # Marks the copies as current, which closes open copy reports.
            touch "$reports/ok"
            exit 0
          fi
          # The same differences give the same ID, so an issue opens once per new difference.
          id=$(printf '%s\n%s\n' "$changes" "$truncated" | sha256sum | cut -c1-8)
          {
            printf 'The loader finder copies in `decky_watch.py` and `tools/runtime_probe.ts` follow decky-loader `%s`. The fork has moved on.\n\n' "$loader_copied"
            [ "$truncated" = false ] || printf -- '- The fork changed 300 or more files; GitHub lists only the first 300, so check the full comparison.\n'
            if [ -n "$changes" ]; then
              printf -- '- Changed lines that search Steam'"'"'s code or use Steam'"'"'s globals:\n\n```diff\n%s\n```\n' "$changes"
            fi
            printf '\n[Compare](https://github.com/%s/compare/%s...main)\n\n' "$fork" "$loader_copied"
            printf 'Update the loader entries of `FINDERS` in `decky_watch.py` and the predicates in `tools/runtime_probe.ts` where needed. Then set `LOADER` to the reviewed fork commit. This issue closes by itself when the copies match the fork.\n'
          } > "$reports/$id.md"
      - name: Open and close issues for Decky finders
        # always(): report what either check found, even if the other one failed.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reports="$RUNNER_TEMP/steamui-watch/reports"
          issues=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 1000 --json number,title,state --jq '.[] | "\(.number)\t\(.title)\t\(.state)"')
          for report in "$reports"/static/*.md "$reports"/runtime/*.md "$reports"/upgrade/*/*.md "$reports"/copies/*.md "$reports"/props/*.md; do
            [ -e "$report" ] || continue
            name=$(basename "$report" .md)
            case "$report" in
              */props/*.reference.md) continue ;;
              */runtime/*) title="Decky runtime finders failing in ${name/-/ }" ;;
              */upgrade/*) ui=$(basename "$(dirname "$report")"); title="Decky finders failing with @decky/ui $ui in ${name/-/ }" ;;
              */copies/*) title="Decky finder copies out of date ($name)" ;;
              */props/*) title="Decky extra props changed in ${name/-/ }" ;;
              *) title="Decky finders missing in ${name/-/ }" ;;
            esac
            number=
            state=
            while IFS=$'\t' read -r existing_number existing_title existing_state; do
              if [ "$existing_title" = "$title" ]; then
                number=$existing_number
                state=$existing_state
                break
              fi
            done <<<"$issues"
            if [ "$state" = open ] || [ "$state" = OPEN ]; then
              case "$report" in
                */runtime/*|*/upgrade/*) gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$report" ;;
              esac
            elif [ -z "$number" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --assignee "$GITHUB_REPOSITORY_OWNER" \
                --title "$title" --body-file "$report"
            fi
          done
          # Close an open report when the same check passed in this run on the same branch, at the
          # same or a newer client version. A check that did not run leaves no .ok file and closes nothing.
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json number,title --jq '.[] | "\(.number)\t\(.title)"')
          while IFS=$'\t' read -r number title; do
            case "$title" in
              "Decky extra props changed in "*) continue ;;
              "Decky finders missing in "*) check=static ;;
              "Decky runtime finders failing in "*) check=runtime ;;
              # Any @decky/ui version: a pass with a newer latest makes an older latest's report moot.
              "Decky finders failing with @decky/ui "*) check='upgrade/*' ;;
              "Decky finder copies out of date ("*)
                if [ -e "$reports/copies/ok" ]; then
                  gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "The finder copies match the fork again ([run]($run))." </dev/null
                fi
                continue ;;
              *) continue ;;
            esac
            read -r branch version <<<"${title##* in }"
            # $check is unquoted so that upgrade/* expands.
            for ok in "$reports"/$check/"$branch"-*.ok; do
              [ -e "$ok" ] || continue
              passed=$(basename "$ok" .ok)
              if [ "${passed#*-}" -ge "$version" ]; then
                gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "The same check passes on $branch ${passed#*-} ([run]($run))." </dev/null
                break
              fi
            done
          done <<<"$open"

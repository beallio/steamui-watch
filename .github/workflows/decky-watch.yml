name: Watch Decky finders

# Early warning: report Steam Deck client versions whose bundle no longer has what the
# @decky/ui and decky-loader finders search for. A beta report comes before the stable update.
on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  # contents: write saves finder snapshots to the finder-data branch.
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    # Backstop only: a normal run takes about 2 minutes. The default is 6 hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.0"
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Check Decky finders in the bundle text
        run: uv run --locked --no-dev python decky_watch.py "$RUNNER_TEMP/steamui-watch/reports/static"
      - name: Run Decky finders in headless Chrome
        # Runs even if the text check failed: the two checks are independent.
        if: always()
        # A hung browser fails this step; the issue step still runs.
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export TMPDIR="${RUNNER_TEMP}/steamui-watch/runtime"
          mkdir -m 700 -p "$TMPDIR"
          reports="$RUNNER_TEMP/steamui-watch/reports"
          # awk reads to the end: exiting early would kill gh with SIGPIPE under pipefail.
          ui=$(gh api repos/beallio/decky-loader/contents/frontend/pnpm-lock.yaml -H 'Accept: application/vnd.github.raw' |
            awk '/^      .@decky\/ui.:$/ && !found { getline; getline; sub(/^ *version: */, ""); sub(/[(].*/, ""); print; found = 1 }')
          [ -n "$ui" ] || { echo 'no @decky/ui version in the decky-loader lock file' >&2; exit 1; }
          probe() { # <@decky/ui version> <report dir> [probe options]
            npm pack "@decky/ui@$1" --pack-destination "$TMPDIR" --silent
            mkdir "$TMPDIR/decky-ui-$1"
            tar -xzf "$TMPDIR/decky-ui-$1.tgz" -C "$TMPDIR/decky-ui-$1"
            bun tools/runtime_probe.ts --decky-ui "$TMPDIR/decky-ui-$1/package" --report-dir "$2" "${@:3}"
          }
          probe "$ui" "$reports/runtime" --snapshot-dir "$RUNNER_TEMP/steamui-watch/snapshots"
          # Pre-upgrade check: the npm latest the fork has not locked yet. Its passes close older upgrade reports.
          latest=$(npm view @decky/ui version)
          upgrade="$reports/upgrade/$latest"
          mkdir -p "$upgrade"
          if [ "$latest" = "$ui" ]; then
            cp "$reports"/runtime/*.ok "$upgrade/" 2>/dev/null || true
            exit 0
          fi
          probe "$latest" "$upgrade"
          for f in "$upgrade"/*.md; do
            [ -e "$f" ] || continue
            body=$(cat "$f")
            printf '`@decky/ui` %s is the npm `latest`; the fork locks %s. Fix this before the fork upgrades.\n\n%s\n' "$latest" "$ui" "$body" > "$f"
          done
      - name: Save finder snapshots
        # Where each finder's Steam object is and its fingerprint, per client and @decky/ui version:
        # the baseline for finding a broken finder's object again in a later build.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          snapshots="$RUNNER_TEMP/steamui-watch/snapshots"
          data="$RUNNER_TEMP/steamui-watch/finder-data"
          compgen -G "$snapshots/*.json" >/dev/null || exit 0
          gh auth setup-git
          gh repo clone "$GITHUB_REPOSITORY" "$data" -- --depth 1 --no-checkout
          # Exit status 2: the branch does not exist yet. Anything else is a real failure.
          status=0
          git -C "$data" ls-remote --exit-code --heads origin finder-data >/dev/null || status=$?
          case $status in
            0) git -C "$data" fetch -q --depth 1 origin finder-data && git -C "$data" checkout -q -B finder-data FETCH_HEAD ;;
            2) git -C "$data" checkout -q --orphan finder-data && git -C "$data" rm -rqf --cached --ignore-unmatch . ;;
            *) exit "$status" ;;
          esac
          mkdir -p "$data/snapshots"
          # Keep the first snapshot of each client and @decky/ui version: it is the reviewed baseline.
          for f in "$snapshots"/*.json; do
            [ -e "$data/snapshots/${f##*/}" ] || cp "$f" "$data/snapshots/"
          done
          git -C "$data" config user.name 'github-actions[bot]'
          git -C "$data" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$data" add snapshots
          if ! git -C "$data" diff --cached --quiet; then
            git -C "$data" commit -qm 'chore(finders): retain Decky finder snapshots'
            git -C "$data" push -q origin HEAD:finder-data
          fi
      - name: Compare the finder copies with the decky-loader fork
        # decky_watch.py and tools/runtime_probe.ts copy finders by hand; report when the fork moves on.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fork=beallio/decky-loader
          reports="$RUNNER_TEMP/steamui-watch/reports/copies"
          mkdir -p "$reports"
          labels=$(uv run --locked --no-dev python -c 'import decky_watch as d; print(d.UI.split()[-1], d.LOADER.split()[-1])')
          read -r ui_copied loader_copied <<<"$labels"
          # awk reads to the end: exiting early would kill gh with SIGPIPE under pipefail.
          ui_locked=$(gh api "repos/$fork/contents/frontend/pnpm-lock.yaml" --jq .content | base64 -d |
            awk '/^      .@decky\/ui.:$/ && !found { getline; getline; sub(/^ *version: */, ""); sub(/[(].*/, ""); print; found = 1 }')
          [ -n "$ui_locked" ] || { echo 'no @decky/ui version in the decky-loader lock file' >&2; exit 1; }
          compare=$(gh api "repos/$fork/compare/$loader_copied...main")
          # Changed frontend lines that search Steam's code or use Steam's globals. A heuristic: it
          # can miss a change, and it reports some changes that need no update.
          pattern='find[A-Z][A-Za-z]*\(|toString\(|createPropListRegex|SteamClient\.|window\.[A-Z][A-Za-z]*(Store|Manager)\b'
          changes=$(jq -r --arg re "$pattern" '.files[] | select(.filename | startswith("frontend/src/")) | .filename as $f
            | if .patch == null then "\($f): (GitHub shows no diff for this file)"
              else .patch | split("\n")[] | select(test("^[+-]") and test($re)) | "\($f): \(.)" end' <<<"$compare")
          # The compare API lists at most 300 files.
          truncated=$(jq '.files | length >= 300' <<<"$compare")
          if [ "$ui_locked" = "$ui_copied" ] && [ -z "$changes" ] && [ "$truncated" = false ]; then
            # Marks the copies as current, which closes open copy reports.
            touch "$reports/ok"
            exit 0
          fi
          # The same differences give the same ID, so an issue opens once per new difference.
          id=$(printf '%s\n%s\n%s\n' "$ui_locked" "$changes" "$truncated" | sha256sum | cut -c1-8)
          {
            printf 'The finder copies in `decky_watch.py` and `tools/runtime_probe.ts` follow `@decky/ui` %s and decky-loader `%s`. The fork has moved on.\n\n' "$ui_copied" "$loader_copied"
            printf -- '- `@decky/ui` locked in the fork: `%s`\n' "$ui_locked"
            [ "$truncated" = false ] || printf -- '- The fork changed 300 or more files; GitHub lists only the first 300, so check the full comparison.\n'
            if [ -n "$changes" ]; then
              printf -- '- Changed lines that search Steam'"'"'s code or use Steam'"'"'s globals:\n\n```diff\n%s\n```\n' "$changes"
            fi
            printf '\n[Compare](https://github.com/%s/compare/%s...main)\n\n' "$fork" "$loader_copied"
            printf 'Update `FINDERS`, `UI` and `LOADER` in `decky_watch.py` and the predicates in `tools/runtime_probe.ts` where needed. Then set `LOADER` to the reviewed fork commit and close this issue.\n'
          } > "$reports/$id.md"
      - name: Open and close issues for Decky finders
        # always(): report what either check found, even if the other one failed.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reports="$RUNNER_TEMP/steamui-watch/reports"
          titles=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 1000 --json title --jq '.[].title')
          for report in "$reports"/static/*.md "$reports"/runtime/*.md "$reports"/upgrade/*/*.md "$reports"/copies/*.md; do
            [ -e "$report" ] || continue
            name=$(basename "$report" .md)
            case "$report" in
              */runtime/*) title="Decky runtime finders failing in ${name/-/ }" ;;
              */upgrade/*) ui=$(basename "$(dirname "$report")"); title="Decky finders failing with @decky/ui $ui in ${name/-/ }" ;;
              */copies/*) title="Decky finder copies out of date ($name)" ;;
              *) title="Decky finders missing in ${name/-/ }" ;;
            esac
            # One issue per check and client version; a closed issue means "checked".
            if grep -qxF "$title" <<<"$titles"; then continue; fi
            gh issue create --repo "$GITHUB_REPOSITORY" --assignee "$GITHUB_REPOSITORY_OWNER" \
              --title "$title" --body-file "$report"
          done
          # Close an open report when the same check passed in this run on the same branch, at the
          # same or a newer client version. A check that did not run leaves no .ok file and closes nothing.
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json number,title --jq '.[] | "\(.number)\t\(.title)"')
          while IFS=$'\t' read -r number title; do
            case "$title" in
              "Decky finders missing in "*) check=static ;;
              "Decky runtime finders failing in "*) check=runtime ;;
              # Any @decky/ui version: a pass with a newer latest makes an older latest's report moot.
              "Decky finders failing with @decky/ui "*) check='upgrade/*' ;;
              "Decky finder copies out of date ("*)
                if [ -e "$reports/copies/ok" ]; then
                  gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "The finder copies match the fork again ([run]($run))." </dev/null
                fi
                continue ;;
              *) continue ;;
            esac
            read -r branch version <<<"${title##* in }"
            # $check is unquoted so that upgrade/* expands.
            for ok in "$reports"/$check/"$branch"-*.ok; do
              [ -e "$ok" ] || continue
              passed=$(basename "$ok" .ok)
              if [ "${passed#*-}" -ge "$version" ]; then
                gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "The same check passes on $branch ${passed#*-} ([run]($run))." </dev/null
                break
              fi
            done
          done <<<"$open"

name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.0"
      # --locked: fail if uv.lock no longer matches pyproject.toml.
      - name: Install Python and ty
        run: uv sync --locked
      - name: Tests
        run: uv run --locked python -m unittest
      - name: Type check
        run: uv run --locked ty check
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Probe tests
        run: |
          bun install --frozen-lockfile
          bun test tools/ packages/
      - name: Build Decky extras
        run: bun packages/decky-extras/build.ts --outdir "$RUNNER_TEMP/decky-extras-package"
